# Optional: PostgreSQL for the prototype, if you don't have one installed.
# Uses host port 5433 so it doesn't clash with a local PostgreSQL on 5432.
#   docker compose up -d
#   DATABASE_URL="postgresql://postgres:postgres@localhost:5433/sustainability_db?schema=public"
services:
  db:
    image: postgres:17-alpine
    container_name: sustainability-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sustainability_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
